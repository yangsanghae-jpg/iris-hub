# diagnosis-tool 데이터 재구조화 + A1 규모평가 오버레이 마이그레이션 추적
# 상태: git HEAD 기준 자동 평가 (diagnosis_eval.py) — 수동 설정 없음
# 정본: diagnosis-tool/docs/data_restructure/diagnosis_tool_data_restructure_design_M5_2026-06-29.md §7
# A1 overlay: diagnosis-tool/docs/by_step/diagnosis_tool_A1_산업팩_마이그레이션_설계_M5_2026-06-30.md

version: data-restructure-v1.1
project: diagnosis-tool
github: https://github.com/yangsanghae-jpg/diagnosis-tool
doc_ref: docs/by_step/diagnosis_tool_A1_산업팩_마이그레이션_설계_M5_2026-06-30.md

items:
  # ── Phase 0 — 가드·drift ─────────────────────────────────────────────
  - phase: "0"
    id: "1"
    title: "taxonomy drift 봉합 (client 정본)"
    gate: "client/server md5 동일"
    check:
      equal:
        - - client/data/step1_5/industry_product_taxonomy_v3.json
          - server/data/step1_5/industry_product_taxonomy_v3.json

  - phase: "0"
    id: "2"
    title: "validate_client_server_sync.py"
    gate: "CI green"
    check:
      tracked:
        - scripts/validate_client_server_sync.py

  - phase: "0"
    id: "3"
    title: "validate_i18n_coverage.py"
    gate: "리포트 artifact"
    check:
      tracked:
        - scripts/validate_i18n_coverage.py

  - phase: "0"
    id: "4"
    title: "MANIFEST.json v1 (live 목록)"
    gate: "refs script 일치"
    check:
      tracked:
        - server/data/MANIFEST.json

  # ── Phase 0.5 — Q5 + taxonomy PoC ────────────────────────────────────
  - phase: "0.5"
    id: "1"
    title: "migrate_legacy_to_src.py"
    gate: "q5+taxonomy refs 추출"
    check:
      tracked:
        - scripts/data_poc/migrate_legacy_to_src.py
        - data/src/content/ko/q5.json
        - data/src/structure/q1/taxonomy.structure.json

  - phase: "0.5"
    id: "2"
    title: "build_data.py"
    gate: "build 산출"
    check:
      tracked:
        - scripts/data_poc/build_data.py
        - data/src/structure/q5/recommendation.structure.json

  - phase: "0.5"
    id: "3"
    title: "diff_test_pack.py canonical diff 0"
    gate: "q5+taxonomy client"
    check:
      tracked:
        - scripts/data_poc/diff_test_pack.py
      grep:
        - path: docs/data_restructure/diagnosis_tool_data_poc_phase05_report_M5_2026-06-29.md
          contains: "canonical diff 0"

  - phase: "0.5"
    id: "4"
    title: "validate_q5_recommendation.py"
    gate: "74/74"
    check:
      tracked:
        - scripts/validate_q5_recommendation.py
      grep:
        - path: docs/data_restructure/diagnosis_tool_data_poc_phase05_report_M5_2026-06-29.md
          contains: "74/74"

  - phase: "0.5"
    id: "5"
    title: "Docker volume/COPY 통합"
    gate: "compose 회귀"
    check:
      tracked:
        - docker-compose.yml
      grep:
        - path: docker-compose.yml
          contains: "data/src"

  - phase: "0.5"
    id: "6"
    title: "process_detail 접미사 2차 PoC"
    gate: "§1 snapshot diff 0"
    check:
      tracked:
        - scripts/data_poc/migrate_process_detail.py

  # ── Phase 1 — 인프라 ─────────────────────────────────────────────────
  - phase: "1"
    id: "1"
    title: "data/src 골격 + build_data.py 일반화"
    gate: "Q5+taxonomy diff 0"
    check:
      tracked:
        - Makefile
      grep:
        - path: Makefile
          contains: "data-build"

  - phase: "1"
    id: "2"
    title: "ch1 engine → ch1_mgmt_model only"
    gate: "compose 회귀"
    check:
      absent:
        - server/data/ch1_engine.json

  - phase: "1"
    id: "3"
    title: "client/src/lib/lang.js v0 (Q1·Q5)"
    gate: "snapshot diff"
    check:
      tracked:
        - client/src/lib/lang.js

  - phase: "1"
    id: "4"
    title: "contracts README"
    gate: "—"
    check:
      tracked:
        - docs/data_restructure/README.md

  - phase: "1"
    id: "5"
    title: "make data-build (M2/M5 공통)"
    gate: "유일 배포 경로 ✓7"
    check:
      tracked:
        - Makefile
      script: scripts/run_data_poc.sh

  # ── Phase 2 — L3 확대 ────────────────────────────────────────────────
  - phase: "2"
    id: "1"
    title: "mgmt skeleton + content + renderer id"
    gate: "B01 HTML snapshot"
    check:
      tracked:
        - data/src/structure/mgmt/management_axes.structure.json

  - phase: "2"
    id: "2"
    title: "i18n a1/a2 94키 보완"
    gate: "coverage 100%"
    check:
      script: scripts/validate_i18n_coverage.py

  - phase: "2"
    id: "3"
    title: "DEFAULT_LANG=ko 전환"
    gate: "ui 4언어 키 동일"
    check:
      grep:
        - path: client/assets/i18n.js
          contains: 'DEFAULT_LANG = "ko"'

  - phase: "2"
    id: "4"
    title: "process_detail L3 분리"
    gate: "§1 snapshot"
    check:
      tracked:
        - data/src/content/ko/process_detail.json

  - phase: "2"
    id: "5"
    title: "통합 lang resolver (Q1~Q5)"
    gate: "팩별 golden snapshot"
    check:
      tracked:
        - client/src/lib/lang.js

  # ── Phase 3 — 부채 정리 ──────────────────────────────────────────────
  - phase: "3"
    id: "1"
    title: "ch2 v3 전 카드 L3 이행"
    gate: "9도메인 × 4언어 snapshot"
    check:
      tracked:
        - data/src/content/ko/ch2.json

  - phase: "3"
    id: "2"
    title: "lang_ko.py 제거"
    gate: "ko Ch2 diff 0 without lang_ko"
    check:
      absent:
        - server/lang_ko.py

  - phase: "3"
    id: "3"
    title: "legacy JSON → _archive/generated_legacy"
    gate: "MANIFEST deprecated only"
    check:
      tracked:
        - _archive/generated_legacy/README.md

  - phase: "3"
    id: "4"
    title: "ch2 v2 마스터 폐기"
    gate: "v3 완주 후"
    check:
      absent:
        - server/knowledge/ch2_v2_master.json

  - phase: "3"
    id: "5"
    title: "ch1 3변종 통합"
    gate: "MANIFEST live 1종"
    check:
      tracked:
        - server/data/MANIFEST.json

  # ── Phase A1 — A1 Ch2 규모 평가 오버레이 (A~I) ─────────────────────
  - phase: "A1"
    id: "1"
    title: "SUBIND-OVERLAY compose 훅"
    gate: "pipeline overlay merge"
    check:
      tracked:
        - server/assemble/ch2_system/compose.py
      grep:
        - path: server/assemble/ch2_system/compose.py
          contains: "_apply_pipeline_subindustry_overlay"

  - phase: "A1"
    id: "2"
    title: "merge_a1_industry_scale_overlay.py"
    gate: "A~I 정규화·병합"
    check:
      tracked:
        - scripts/merge_a1_industry_scale_overlay.py

  - phase: "A1"
    id: "3"
    title: "runtime overlay 74 subindustries"
    gate: "3330 cells"
    check:
      tracked:
        - server/knowledge/step5/ch2/_overlay/subindustry_scale_overlay_v1.json
      grep:
        - path: server/knowledge/step5/ch2/_overlay/subindustry_scale_overlay_v1.json
          contains: '"sample_count": 74'

  - phase: "A1"
    id: "4"
    title: "test_a1_scale_overlay_all_industries"
    gate: "74종 스모크"
    check:
      tracked:
        - server/tests/test_a1_scale_overlay_all_industries.py
      grep:
        - path: docs/by_step/diagnosis_tool_A1_산업팩_A-I_적용보고_M5_2026-06-30.md
          contains: "3330"

  - phase: "A1"
    id: "5"
    title: "평가형 zh/ko i18n (Ch2 2.3)"
    gate: "localizedPipelineField"
    check:
      grep:
        - path: server/assemble/ch2_system/compose.py
          contains: "normal_criterion_zh"
        - path: client/i18n/zh/ui.json
          contains: "a1.card.eval.scale_meaning"
        - path: client/src/ui/a1/a1_ch2_card_renderer_common.js
          contains: "localizedPipelineField"

  - phase: "A1"
    id: "6"
    title: "마이그레이션 계획 문서"
    gate: "Phase 2 Exit · iris-hub 연동"
    check:
      grep:
        - path: docs/by_step/diagnosis_tool_A1_산업팩_A-I_적용보고_M5_2026-06-30.md
          contains: "iris-hub Phase A1"
        - path: scripts/merge_a1_industry_scale_overlay.py
          contains: "A1_DATA_DIR"

  - phase: "A1"
    id: "8"
    title: "마이그레이션 설계 문서"
    gate: "ADR·i18n 계약·Phase 경계"
    check:
      grep:
        - path: docs/by_step/diagnosis_tool_A1_산업팩_마이그레이션_설계_M5_2026-06-30.md
          contains: "A1-SCALE-OVERLAY-MIGRATION-DESIGN"
        - path: docs/by_step/diagnosis_tool_A1_산업팩_마이그레이션_설계_M5_2026-06-30.md
          contains: "localizedPipelineField"

  - phase: "A1"
    id: "7"
    title: "Ch2 2.2·2.4·2.5 다국어 (Phase 3)"
    gate: "assets/maturity/stack zh"
    check:
      tracked:
        - client/src/ui/a1/a1_ch2_assets_i18n.js

deps:
  "0/2": ["0/1"]
  "0/4": ["0/1"]
  "0.5/2": ["0.5/1"]
  "0.5/3": ["0.5/2"]
  "0.5/4": ["0.5/3"]
  "0.5/5": ["0.5/4"]
  "0.5/6": ["0.5/3"]
  "1/1": ["0.5/3", "0/1"]
  "1/2": ["1/1"]
  "1/3": ["1/1"]
  "1/5": ["1/1"]
  "2/1": ["1/1"]
  "2/5": ["1/3"]
  "3/1": ["2/1"]
  "3/2": ["3/1"]
  "A1/2": ["A1/1"]
  "A1/3": ["A1/2"]
  "A1/4": ["A1/3"]
  "A1/5": ["A1/3"]
  "A1/6": ["A1/4", "A1/5"]
  "A1/8": ["A1/6"]
  "A1/7": ["A1/8"]
