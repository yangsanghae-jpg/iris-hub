  * { box-sizing: border-box; }
  html, body {

  body { padding: 28px 32px 60px; max-width: 1400px; margin: 0 auto; }
  .note {

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;

  .step:last-child { border-right: none; }
  .step:hover { background: #fafbfd; }
  .step .num {

  .step.done .num { background: var(--hue); border-color: var(--hue); color: #fff; }

  .step.active { background: var(--tint); }
  .step.active .num { border-color: var(--hue); color: var(--hue); background: #fff; }
  .step.active .lab { color: var(--hue); }

];

const PROGRESS = [
  {lab:'① 소스', v:'직접 입력 · 402자', editable:true},
  {lab:'② 확장', v:'gemma4:e4b · 완료', editable:true},
  {lab:'③ 설계', v:'iris(다크) · PDF', editable:true},
  {lab:'④ 렌더', v:'대기 중', editable:false}
];

function buildProgress() {
  const el = document.getElementById('progress-strip');
  el.innerHTML = PROGRESS.map((p,i) => `
    <div class="p-item" ${p.editable ? `onclick="setStep(${i})"` : ''}>
      <div class="p-k"><span>${p.lab}</span>${p.editable ? `<a href="#" onclick="event.stopPropagation();setStep(${i});return false">편집</a>` : ''}</div>
      <div class="p-v${i > step ? ' muted' : ''}">${p.v}</div>
    </div>
  `).join('');
}

function toggleRenderCard(el) {
  el.classList.toggle('selected');
  el.querySelector('input[type=checkbox]').checked = el.classList.contains('selected');
  const n = document.querySelectorAll('.render-card.selected').length;
  const out = document.getElementById('render-sel-count');
  if (out) out.textContent = n === 0 ? '선택된 페이지 없음' : n + '개 페이지 선택됨';
}

function render() {
  document.getElementById('panel').innerHTML = PANELS[step];
  document.getElementById('side').innerHTML = SIDES[step];
  for (let i = 0; i < 4; i++) {
    const s = document.getElementById('step-' + i);
    s.classList.remove('done','active');
    if (i < step) s.classList.add('done');
    if (i === step) s.classList.add('active');
  }
  document.getElementById('prev-btn').style.visibility = step === 0 ? 'hidden' : 'visible';
  document.getElementById('next-btn').textContent = NEXT_LABELS[step];
  buildProgress();
}
function setStep(i) { step = i; render(); }
function nextStep() { if (step < 3) { step++; render(); } }
function prevStep() { if (step > 0) { step--; render(); } }

buildStepper();
render();
</script>
